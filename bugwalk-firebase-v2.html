<title>Bug Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Luckiest+Guy&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
<style>
  /* ---- Design tokens: a single committed world (sunny sidewalk arcade cabinet) ---- */
  :root{
    --paper:#f6ecd8;
    --paper-2:#efe1c4;
    --ink:#2b2115;
    --ink-soft:#6b5a41;
    --pink:#ff6fa8;
    --pink-deep:#d43f80;
    --pink-pale:#ffe1ee;
    --sky:#4fa8d8;
    --concrete:#dcd4c1;
    --concrete-2:#c2b79d;
    --grass:#79a851;
    --grass-2:#527a34;
    --line:#ff6fa8;
    --shadow:rgba(43,33,21,.22);
    --good:#4d9a5a;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--grass);
    color:var(--ink);
    font-family:'Baloo 2', ui-rounded, 'Segoe UI', sans-serif;
    height:100dvh;
    display:flex;
    justify-content:center;
    overflow:hidden;
    padding:8px 10px;
  }

  /* no max-width here -- the whole bordered cabinet (border, grass margins
     and all) should fill the real screen width, same as the sidewalk/grass
     split inside it does; the internal MAX_W sanity bound in the game's JS
     is what keeps the logical resolution from going absurd on huge monitors */
  .stage{ width:100%; height:100%; display:flex; justify-content:center; }

  .cabinet{
    width:100%;
    height:100%;
    min-height:0;
    background:linear-gradient(180deg,#fffdf7,#fbf2dc 60%,var(--paper-2));
    border:3px solid var(--line);
    border-radius:0;
    padding:8px 8px 10px;
    box-shadow:0 18px 40px -18px var(--shadow), inset 0 1px 0 rgba(255,255,255,.6);
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .ready-logo{
    /* 2x its old footprint (was max-width:240px) -- wider than the text
       column below it, so it breaks out of the card's centered flow via
       left:50%+translateX rather than being capped to the card's width.
       82vw is a safety ceiling so it never runs into screen-wrap's own
       clipped edge on narrow phones; on anything roomier it sits at a
       flat 480px. */
    position:relative;
    left:50%;
    transform:translateX(-50%);
    width:min(480px, 82vw);
    aspect-ratio:320/106;
    margin:0 0 10px;
  }
  .logo-flowers{
    position:absolute; inset:0;
    width:100%; height:100%;
    shape-rendering:crispEdges;
  }
  .logo-canvas{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:auto; height:auto;
    max-width:86%; max-height:74%;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }

  /* the live in-game readout is now plain text pinned to the top-left of
     the screen -- "STEPS X   MOOD X" in one line, no watch bezel around
     it -- so it covers as little of the sidewalk as possible */
  .hud-stats{
    position:absolute;
    top:10px; left:50%;
    transform:translateX(-50%);
    /* without this, an absolutely-positioned auto-width box anchored at
       left:50% only gets HALF the container as its shrink-to-fit budget
       (the browser sizes it before the translateX shift is applied), so
       it wraps to two lines on narrower screens well before it actually
       needs to -- force one line and let it center as a whole */
    white-space:nowrap;
    z-index:6;
    font-family:'Silkscreen', monospace;
    font-weight:700;
    font-size:14px;
    letter-spacing:.02em;
    color:#3f3f3f;
    text-shadow:2px 2px 0 #3a2415;
    pointer-events:none;
  }
  .hud-stats[hidden]{ display:none; }
  .hud-stats .hud-mood{ color:#ff9fc9; }
  /* hidden during the DIVA DOWN transition -- the death screen shows the
     same numbers on its own watch, so this one steps aside instead of
     peeking through the overlay's translucent background */
  .screen-wrap.death .hud-stats{ opacity:0; }

  /* pixel wristwatch bezel (top/bottom strap lugs, a pink bezel matching
     the buttons, and a dark LCD-style screen), reused by the ready-screen
     and death-screen best-score watches -- steps and mood are drawn onto
     its screen as genuine pixel-art text via drawPixelBitmapText, the same
     technique the logo and overlay titles use. */
  .pixel-watch{
    position:absolute;
    top:4px; left:10px;
    z-index:6;
    display:flex;
    flex-direction:column;
    align-items:center;
    pointer-events:none;
  }
  .pixel-watch[hidden]{ display:none; }
  .watch-lug{
    width:14px; height:5px;
    background:var(--line);
  }
  .watch-case{
    background:var(--pink);
    border:3px solid var(--line);
    padding:3px 4px;
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,.35),
      inset -2px -2px 0 rgba(0,0,0,.2),
      3px 3px 0 var(--pink-deep);
  }
  .watch-screen{
    background:#3a2415;
    border:2px solid #1a0f08;
    padding:4px 6px;
    display:flex;
    flex-direction:column;
    gap:2px;
    align-items:center;
  }
  .watch-value{ margin-bottom:2px; }
  .watch-canvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }
  /* the death-screen watch reuses the same lug/case/screen bezel as the
     in-game HUD watch, but laid out inline (centered, in normal flow) with
     two side-by-side columns instead of one absolutely-positioned column */
  .watch-screen-row{ flex-direction:row; align-items:flex-start; gap:10px; }
  .watch-col{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .pixel-watch.inline{
    position:relative;
    top:auto; left:auto;
    margin:0 auto 16px;
  }
  /* .screen-wrap.death fades the in-game HUD watch out (it's replaced by
     this one), but that opacity:0 rule would also catch this watch since
     it's nested inside .screen-wrap -- override it back to visible here */
  .screen-wrap.death .pixel-watch.inline{ opacity:1; }

  .screen-wrap{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:100%;
    border-radius:0;
    overflow:hidden;
    border:3px solid var(--pink);
    box-shadow:inset 0 0 0 3px #fffdf8, inset 0 10px 22px -14px rgba(0,0,0,.45);
    touch-action:none;
    background:var(--grass);
  }
  #game{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    image-rendering:pixelated;
    cursor:grab;
  }
  .screen-wrap.dragging #game{ cursor:grabbing; }

  .death-art{
    position:absolute; inset:0;
    /* two layers: the crying-girl-in-grass GIF on top, sized by height only
       (never stretched/zoomed to cover the whole width), plus a small
       tileable grass swatch underneath in the exact same palette as this
       art's own baked-in grass (and the live game's own grass fill) --
       filling in as a matching grass border on screens wider than the art's
       own aspect ratio, instead of the art getting blown up edge to edge.
       The tile's on-screen size is set from JS (see updateArtBackgrounds)
       so its blocks stay the same visual scale as everything else. */

  .ready-art[hidden]{ display:none; }

  .level-banner{
    position:absolute;
    left:50%; top:34%;
    transform:translate(-50%,-50%) scale(.85);
    font-family:'Press Start 2P', 'Luckiest Guy', 'Baloo 2', cursive;
    font-size:12px;
    letter-spacing:0;
    color:#fff;
    background:var(--pink-deep);
    border:2px solid #fff;
    padding:8px 12px;
    border-radius:0;
    box-shadow:0 8px 18px -8px rgba(0,0,0,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    white-space:nowrap;
  }
  .level-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .level-banner.night{ background:#1a2a6c; }
  .level-banner.day{ background:#ff9f4a; color:#3a2415; }
  @media (prefers-reduced-motion: reduce){
    .level-banner{ transition:none; }
  }

  .overlay{
    position:absolute; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    /* same transparency as the death screen, so the scene scrolling behind
       the card reads the same way on every overlay, not just DIVA DOWN */
    background:linear-gradient(180deg, rgba(43,33,21,.22), rgba(43,33,21,.32));
    opacity:1;
    transition:opacity .15s ease;
    /* the death screen's card can now hold more stacked content (run stats,
       a name-entry prompt, the high-scores button/list) than a short screen
       has room for -- scroll the overlay itself rather than letting the
       bottom of the card silently run off the edge with no way to reach it */
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .overlay[hidden]{ display:none; }
  .overlay.fade-out{ opacity:0; pointer-events:none; }
  .screen-wrap.death .pixel-watch{ opacity:0; }
  .screen-wrap.death .pause-btn{ display:none; }

  .overlay-card{
    text-align:center;
    color:#fff;
    max-width:280px;
  }
  /* on the ready screen AND the death (DIVA DOWN) screen: the title (plus,
     on death, the flavor-text watch) sits pinned to the top and everything
     else (instructions/scores/button on ready; the run's watch + button on
     death) sits pinned to the bottom, so the background art -- the girl on
     the sidewalk, or the crying girl in the grass -- shows cleanly in the
     middle instead of being covered by a centered card. PAUSED keeps the
     plain centered card, since there's no art behind it to protect */
  .overlay.split-layout{ align-items:stretch; }
  .overlay.split-layout .overlay-card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    width:100%;
    min-height:100%;
  }
  .overlay-top, .overlay-bottom{ width:100%; }
  .overlay-title-wrap{
    display:flex;
    justify-content:center;
    margin:0 0 12px;
  }
  /* hidden on the ready screen now (no more "READY?" text) -- the
     unconditional display:flex above would otherwise win over the
     hidden attribute's default UA style, same as every other
     [hidden]-toggled element in this file */
  .overlay-title-wrap[hidden]{ display:none; }
  .overlay-title-canvas{
    display:block;
    max-width:100%;
    height:auto;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }
  .overlay-title-wrap.drop-in{
    animation: diva-drop .65s cubic-bezier(.25,.85,.3,1.35) both;
  }
  @keyframes diva-drop{
    0%{ transform:translateY(-260px); opacity:0; }
    58%{ transform:translateY(16px); opacity:1; }
    78%{ transform:translateY(-6px); }
    100%{ transform:translateY(0); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .overlay-title-wrap.drop-in{ animation:none; }
  }
  .overlay-card p{
    margin:0 0 14px;
    /* same pixel font as READY?/DIVA DOWN -- much wider per letter than the
       body font it replaces, so the size drops a lot to still fit the card */
    font-family:'Press Start 2P', monospace;
    font-size:8px;
    line-height:1.9;
    color:#f3e9d6;
  }
  /* the death-screen flavor text now lives boxed inside its own small
     pixel-watch (see #flavorWatch), same bezel language as the score
     watches, instead of floating loose over the background art */
  /* the start/restart button now lives up in overlay-top, right where the
     READY?/title text used to sit (see the READY-state override below and
     the button's new HTML position) -- it's the same #startBtn element for
     both screens, so moving it here places it at the same spot on both the
     ready screen and the DIVA DOWN screen automatically. Needs its own
     bottom margin now that it isn't the last element in the flow anymore. */
  #startBtn{ margin:0 0 14px; }
  .flavor-watch{ margin:0 0 10px; }
  .flavor-watch .watch-case{ width:100%; max-width:230px; box-sizing:border-box; }
  .flavor-watch .watch-screen{ width:100%; box-sizing:border-box; padding:7px 9px; }
  .overlay-card .flavor-text{
    margin:0;
    font-size:12.5px;
    font-weight:700;
    line-height:1.35;
    color:#ffe27a;
    text-wrap:balance;
    text-shadow:1px 1px 0 #3a2415;
  }
  /* readyScores (the ready screen's best-ever steps/mood) is now a
     pixel-watch widget, same as everywhere else -- see #readyScores'
     watch-col canvases, wired up alongside the other watches in JS */
  #readyScores{ margin:0 0 16px; }

  /* worldwide leaderboard: the "new high score" name-entry prompt and the
     top-10 list both reuse the same watch-case/watch-screen bezel as the
     rest of the run stats, just with plain DOM text instead of the
     pixel-bitmap-canvas trick -- names are arbitrary strings, so re-baking
     a canvas per keystroke isn't worth it, and 'Press Start 2P'/'Silkscreen'
     already read as chunky pixel type without it. */
  /* .pixel-watch is normally a pointer-events:none decorative readout (see
     the base rule above) -- this is the one pixel-watch that holds real
     controls (the name input + its buttons), so it needs pointer events
     restored; pointer-events is inherited, so setting it here is enough
     for the input/buttons inside to work too */

  #nameEntryWatch .watch-case, #highscoresPanel .watch-case{ width:100%; max-width:250px; box-sizing:border-box; }

<!-- ---------- Firebase (Firestore) leaderboard backend ----------
     Loaded as an ES module so it can use the modular Firebase Web SDK
     straight from Google's CDN -- no build step, still a single static
     file. It only exposes two small async functions on window; the main
     game script below (a plain classic script, not a module) calls those
     instead of touching the Firebase SDK directly, so the two pieces stay
     loosely coupled and the game logic doesn't need to become a module
     itself. Reads and creates are both public by design (any player can
     read the top 10 and post a run with no login) -- Firestore Security
     Rules on the "scores" collection are what keep this safe: writes are
     validated server-side (name is a string of 1-14 chars, score is a
     positive integer) and updates/deletes are blocked entirely, so unlike
     the CrudCrud endpoint this replaced, the write access itself is a real
     enforced rule, not just an unguessable URL. This project runs on
     Firebase's free Spark plan, which has no request-count ceiling anywhere
     near what a browser game like this needs (50k reads / 20k writes per
     day) and -- unlike the CrudCrud/jsonblob dev-tier services tried
     before -- doesn't get reclaimed or rate-limited out from under it. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, query, orderBy, limit
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyDWdrtd7mxGIcIUYCGfTMY3V8vhgdI2w3E",
    authDomain: "bugwalk-f3c4a.firebaseapp.com",
    projectId: "bugwalk-f3c4a",
    storageBucket: "bugwalk-f3c4a.firebasestorage.app",
    messagingSenderId: "664036891322",
    appId: "1:664036891322:web:19f571aaeb01e44b1bc083"
  };

  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);
  var scoresCol = collection(db, "scores");

  // exposed to the classic script below -- kept intentionally tiny
  // (just "give me the top 10" and "add one run") so the game code never
  // has to know it's talking to Firestore specifically
  window.__bugwalkLeaderboard = {
    fetchTop10: function(){
      return getDocs(query(scoresCol, orderBy("score", "desc"), limit(10)))
        .then(function(snap){
          var out = [];
          snap.forEach(function(doc){
            var data = doc.data();
            out.push({ _id: doc.id, name: data.name, score: data.score });
          });
          return out;
        });
    },
    submitScore: function(name, scoreVal){
      return addDoc(scoresCol, { name: name, score: scoreVal })
        .then(function(ref){
          return { _id: ref.id, name: name, score: scoreVal };
        });
    }
  };
</script>

  // ---------- pixelated title text (shared by the Bug Walk logo and the
  // READY?/PAUSED/DIVA DOWN overlay title) ----------
  // Draws flat-color type with a dropped shadow -- the same look DIVA DOWN
  // has always used -- but bakes it at a tiny internal resolution and then
  // hard-thresholds the antialiased edge pixels to fully solid or fully
  // transparent before the canvas is displayed scaled way up with
  // image-rendering:pixelated. That turns the smooth vector letterforms into
  // real hard-edged pixel blocks, matching the rest of the game's pixel art.
  function thresholdAlpha(c, w, h, cutoff){
    cutoff = cutoff || 128;
    var img = c.getImageData(0, 0, w, h);
    var d = img.data;
    for (var i = 3; i < d.length; i += 4){
      d[i] = d[i] >= cutoff ? 255 : 0;
    }
    c.putImageData(img, 0, 0);
  }

  // fontStack/weight are optional -- every existing caller (logo, overlay
  // titles) keeps defaulting to the game's usual Press Start 2P, while the
  // watch face passes the more legible Silkscreen pixel font instead
  // fixedW/fixedH are optional: pass them for text that redraws often with
  // changing digits (the watch) so the canvas -- and therefore its visible
  // box -- stays a constant size instead of growing/shrinking by a pixel
  // or two every time the glyphs change (which read as the edge "jittering").
  // Logo/title callers leave them out and keep auto-sizing to their text.
  function drawPixelBitmapText(canvasEl, c, text, fontPx, scale, fillColor, shadowColor, fontStack, weight, fixedW, fixedH){
    fontStack = fontStack || "'Press Start 2P', monospace";
    weight = weight || "900";
    c.font = weight + " " + fontPx + "px " + fontStack;
    var textW = Math.max(1, Math.ceil(c.measureText(text).width));
    var padX = Math.round(fontPx * 0.35);
    var padTop = Math.round(fontPx * 0.35);
    var shadowOff = Math.max(1, Math.round(fontPx * 0.16));
    var w = fixedW || (textW + padX * 2 + shadowOff);
    var h = fixedH || (fontPx + padTop * 2 + shadowOff);
    canvasEl.width = w;
    canvasEl.height = h;
    canvasEl.style.width = (w * scale) + "px";
    // height stays "auto" (the canvas's intrinsic w:h ratio) instead of a
    // second fixed pixel value -- when a wrapper's max-width later clamps
    // the displayed width down (e.g. the DIVA DOWN title on a wide/short
    // screen), the height now shrinks to match instead of staying at its
    // full unclamped size and pushing everything below it down over her face
    canvasEl.style.height = "auto";
    c.clearRect(0, 0, w, h);
    c.font = weight + " " + fontPx + "px " + fontStack;
    c.textBaseline = "alphabetic";
    c.textAlign = "center";
    var cx = w / 2, baseY = h - padTop - shadowOff;
    c.fillStyle = shadowColor;
    c.fillText(text, cx + shadowOff, baseY + shadowOff);
    c.fillStyle = fillColor;
    c.fillText(text, cx, baseY);
    thresholdAlpha(c, w, h);
  }

  // the watch now stacks STEPS/value/MOOD/value vertically instead of one
  // line per stat, using the same 'Luckiest Guy' face the ready/death
  // screen's own high-score numbers use, instead of the pixel Silkscreen
  // font -- the tiny low-res raster + hard alpha threshold below still
  // turns it chunky/blocky at this size, same as everything else
  // Luckiest Guy's swoopy display shapes turned to mush at this tiny raster
  // size once thresholded to hard pixel edges -- Silkscreen is an actual
  // pixel-grid font (built for exactly this: tiny, blocky, legible digits),
  // so every score watch (in-game HUD + death screen) switches to it
  var WATCH_FONT_PX = 9, WATCH_FONT_STACK = "'Silkscreen', 'Press Start 2P', monospace", WATCH_FONT_WEIGHT = "700";

  // fixed box size for just the VALUE lines (the label lines are static
  // text that never changes, so they can auto-size normally) -- big enough

  // itself as steps/mood digits change. Recomputed once real fonts finish
  // loading (see document.fonts.ready below) since fallback-font metrics
  // at first paint may measure a bit differently than the real webfont
  function measureWatchValueBox(){
    dwStepsCtx.font = WATCH_FONT_WEIGHT + " " + WATCH_FONT_PX + "px " + WATCH_FONT_STACK;
    var textW = Math.max(1, Math.ceil(dwStepsCtx.measureText("99.99K").width));
    var padX = Math.round(WATCH_FONT_PX * 0.35);
    var padTop = Math.round(WATCH_FONT_PX * 0.35);
    var shadowOff = Math.max(1, Math.round(WATCH_FONT_PX * 0.16));
    return { w: textW + padX * 2 + shadowOff, h: WATCH_FONT_PX + padTop * 2 + shadowOff };
  }
  var watchValueBoxSize = measureWatchValueBox();

  // ---------- worldwide leaderboard (top 10 mental health scores) ----------
  // worldTop10 is null until the first successful fetch resolves; an empty
  // array once loaded means "loaded, but nobody's on it yet" (still a valid,
  // real state -- distinct from "haven't checked"), so those two must never
  // be conflated when deciding whether a run qualifies.
  var worldTop10 = null;
  var leaderboardStatus = "idle"; // idle | loading | ready | error | unavailable
  var pendingScoreForEntry = null;

  // Firestore does the "top 10" sorting itself (orderBy + limit in the
  // query built in window.__bugwalkLeaderboard.fetchTop10, see the module
  // script above) rather than fetching every submission ever made and
  // sorting client-side -- so unlike the old CrudCrud version, there's
  // nothing here that needs periodic pruning to stay fast; every historical
  // run can just stay in the collection.
  function fetchLeaderboard(cb){
    if (!window.__bugwalkLeaderboard){
      leaderboardStatus = "unavailable";
      if (cb) cb();
      return;
    }
    leaderboardStatus = "loading";
    window.__bugwalkLeaderboard.fetchTop10()
      .then(function(top10){
        worldTop10 = top10;
        leaderboardStatus = "ready";
        if (cb) cb();
      })
      .catch(function(err){
        leaderboardStatus = "error";
        if (window.console && console.warn) console.warn("Bug Walk leaderboard fetch failed:", err);
        if (cb) cb();
      });
  }

  function qualifiesForTop10(scoreVal){
    if (scoreVal <= 0) return false;
    if (!worldTop10) return false; // not loaded yet -- never guess
    if (worldTop10.length < 10) return true;
    return scoreVal > worldTop10[worldTop10.length - 1].score;
  }

  // a plain create -- each run's score is its own Firestore document, so
  // there's no read-modify-write window for two players finishing around
  // the same time to clobber each other. Server-side Security Rules (not
  // this code) are what actually enforce that name/score are well-formed --
  // this only has to handle its own success/failure path.
  function submitScoreToLeaderboard(name, scoreVal, cb){
    if (!window.__bugwalkLeaderboard){ if (cb) cb(false); return; }
    window.__bugwalkLeaderboard.submitScore(name, Math.floor(scoreVal))
      .then(function(created){
        var list = (worldTop10 || []).concat([created]);
        list.sort(function(a, b){ return b.score - a.score; });
        worldTop10 = list.slice(0, 10);
        leaderboardStatus = "ready";
        if (cb) cb(true);
      })
      .catch(function(err){
        if (window.console && console.warn) console.warn("Bug Walk leaderboard submit failed:", err);
        if (cb) cb(false);
      });
  }

  function renderHighscoresList(){
    highscoresList.innerHTML = "";
    if (leaderboardStatus === "unavailable"){
      var noteU = document.createElement("p");
      noteU.className = "hs-note";
      noteU.textContent = "Leaderboard isn't set up yet.";
      highscoresList.appendChild(noteU);
      return;
    }
    if (leaderboardStatus === "error"){
      var noteE = document.createElement("p");
      noteE.className = "hs-note";
      noteE.textContent = "Couldn't reach the leaderboard. Check your connection and try again later.";
      highscoresList.appendChild(noteE);
      return;
    }
    if (leaderboardStatus === "loading" || !worldTop10){
      var noteL = document.createElement("p");
      noteL.className = "hs-note";
      noteL.textContent = "Loading...";
      highscoresList.appendChild(noteL);
      return;
    }
    if (worldTop10.length === 0){
      var noteZ = document.createElement("p");
      noteZ.className = "hs-note";
      noteZ.textContent = "No scores yet -- be the first!";
      highscoresList.appendChild(noteZ);
      return;
    }
    worldTop10.forEach(function(entry, i){
      var row = document.createElement("div");
      row.className = "hs-row" + (entry._mine ? " mine" : "");
      var rank = document.createElement("span");
      rank.className = "hs-rank";
      rank.textContent = (i + 1) + ".";
      var name = document.createElement("span");
      name.className = "hs-name";
      name.textContent = entry.name || "???";
      var scoreEl = document.createElement("span");
      scoreEl.className = "hs-score";
      scoreEl.textContent = formatK(entry.score);
      row.appendChild(rank);
      row.appendChild(name);
      row.appendChild(scoreEl);
      highscoresList.appendChild(row);
    });
  }

  function sanitizePlayerName(raw){

  function showNameEntry(scoreVal){
    pendingScoreForEntry = scoreVal;

  // permanently dismisses the prompt (used by "skip" and after a successful
  // submit) -- for merely hiding it while the player peeks at High Scores,
  // see goToHighscores()/goBackToDeath() below, which preserve
  // pendingScoreForEntry so the prompt can come back
  function hideNameEntry(){
    nameEntryWatch.hidden = true;
    nameEntryError.hidden = true;
    pendingScoreForEntry = null;
  }

  function submitNameEntry(){
    if (pendingScoreForEntry === null) return;
    var name = sanitizePlayerName(nameEntryInput.value);
    savePlayerName(name);
    var scoreVal = pendingScoreForEntry;
    nameEntrySubmit.disabled = true;
    nameEntryError.hidden = true;
    submitScoreToLeaderboard(name, scoreVal, function(ok){
      nameEntrySubmit.disabled = false;
      if (!ok){

        // plainly -- silently closing it here is what made a failed save
        // look like a successful one before
        nameEntryError.hidden = false;
        return;

      hideNameEntry();
      if (worldTop10){
        // flag this run's own row so it stands out in gold when the list
        // (re)renders, whether that's right now or after tapping High Scores
        for (var i = 0; i < worldTop10.length; i++){

            break;
          }

      renderHighscoresList();
    });
  }
