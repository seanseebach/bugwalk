  // ---------- audio (tiny synthesized sound effects, no external files) ----------
  var audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC){
        try { audioCtx = new AC(); } catch(e) { audioCtx = null; }
      }
    }
    if (audioCtx && audioCtx.state === "suspended"){
      try { audioCtx.resume(); } catch(e) {}
    }
    return audioCtx;
  }

  function playTone(startTime, freq, duration, opts){
    opts = opts || {};
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = opts.type || "sine";
    osc.frequency.setValueAtTime(freq, startTime);
    if (opts.endFreq){
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.endFreq), startTime + duration);
    }
    var peak = opts.gain != null ? opts.gain : 0.25;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(peak, startTime + Math.min(0.02, duration * 0.3));
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playNoiseBurst(startTime, duration, gainPeak){
    var bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++){
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    var noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 900;
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(gainPeak, startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(startTime);
    noise.stop(startTime + duration + 0.02);
  }

  // sparkly rising chime when she grabs the pink pill
  function playPillSound(){
    if (!ensureAudio()) return;
    var t0 = audioCtx.currentTime;
    playTone(t0, 520, 0.13, { type: "triangle", endFreq: 780, gain: 0.22 });
    playTone(t0 + 0.08, 780, 0.18, { type: "triangle", endFreq: 1180, gain: 0.2 });
  }

  // wet slurp when she drinks the iced coffee -- a quick upward suck through
  // the straw, a burst of noise for the slurpy texture, then a little gulp
  function playSlurpSound(){
    if (!ensureAudio()) return;
    var t0 = audioCtx.currentTime;
    playTone(t0, 320, 0.14, { type: "sine", endFreq: 720, gain: 0.22 });
    playNoiseBurst(t0, 0.09, 0.14);
    playTone(t0 + 0.13, 480, 0.09, { type: "sine", endFreq: 240, gain: 0.16 });
  }

  // crackly electric buzz when the swatter zaps -- a sharp crack up front,
  // then a descending buzzy sawtooth with a bit of noise texture
  function playZapSound(){
    if (!ensureAudio()) return;
    var t0 = audioCtx.currentTime;
    playTone(t0, 1400, 0.04, { type: "square", gain: 0.2 });
    playTone(t0 + 0.01, 950, 0.12, { type: "sawtooth", endFreq: 140, gain: 0.3 });
    playNoiseBurst(t0, 0.1, 0.26);
    playNoiseBurst(t0 + 0.05, 0.06, 0.15);
  }

  // wet, low-pitched squish when any bug dies, whatever the method -- a
  // quick downward-sliding thud plus a short burst of noise for texture
  function playSquishSound(){
    if (!ensureAudio()) return;
    var t0 = audioCtx.currentTime;
    playTone(t0, 220, 0.09, { type: "sine", endFreq: 70, gain: 0.28 });
    playNoiseBurst(t0, 0.045, 0.16);
  }

  // soft shimmering hum that loops for as long as the kill-bubble shield is up
  var bubbleAmbient = null;
  function startBubbleAmbient(){
    if (!ensureAudio() || bubbleAmbient) return;
    var osc = audioCtx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = 640;
    var lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 5.5;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 30;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    var gain = audioCtx.createGain();
    var t0 = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    lfo.start(t0);
    bubbleAmbient = { osc: osc, lfo: lfo, gain: gain };
  }
  function stopBubbleAmbient(){
    if (!bubbleAmbient || !audioCtx){ bubbleAmbient = null; return; }
    var t0 = audioCtx.currentTime;
    try {
      bubbleAmbient.gain.gain.cancelScheduledValues(t0);
      bubbleAmbient.gain.gain.setValueAtTime(Math.max(bubbleAmbient.gain.gain.value, 0.0001), t0);
      bubbleAmbient.gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      bubbleAmbient.osc.stop(t0 + 0.3);
      bubbleAmbient.lfo.stop(t0 + 0.3);
    } catch(e) {}
    bubbleAmbient = null;
  }

  // long, droning fly-buzz that starts the instant she dies and keeps
  // looping for as long as the DIVA DOWN screen is up -- a sawtooth drone
  // with a fast wobble on its pitch (like beating wings) and a lowpass
  // filter to take the edge off, closer to a real fly's drone
  var deathBuzz = null;
  function startDeathBuzz(){
    if (!ensureAudio() || deathBuzz) return;
    var osc = audioCtx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = 190;
    var lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 24; // fast wingbeat-rate wobble
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 16;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    var filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 850;
    var gain = audioCtx.createGain();
    var t0 = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.15, t0 + 0.35);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    lfo.start(t0);
    deathBuzz = { osc: osc, lfo: lfo, gain: gain };
  }
  function stopDeathBuzz(){
    if (!deathBuzz || !audioCtx){ deathBuzz = null; return; }
    var t0 = audioCtx.currentTime;
    try {
      deathBuzz.gain.gain.cancelScheduledValues(t0);
      deathBuzz.gain.gain.setValueAtTime(Math.max(deathBuzz.gain.gain.value, 0.0001), t0);
      deathBuzz.gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      deathBuzz.osc.stop(t0 + 0.3);
      deathBuzz.lfo.stop(t0 + 0.3);
    } catch(e) {}
    deathBuzz = null;
  }

  // looping background beat -- an original trap-style groove (flute-ish lead
  // stabs, an 808 bass slide, and a hi-hat pattern) rather than a copy of any
  // specific song, re-scheduled one bar at a time and speeding up each level
  var MUSIC_LEAD_ROOT = 392.0; // G4, for the flute-ish lead stabs
  var MUSIC_BASS_ROOT = 98.0;  // G2, for the 808 slides
  var MUSIC_STEPS_PER_BAR = 16; // 16th-note grid
  var MUSIC_LEAD_STEPS = { 0: 7, 4: 5, 8: 3, 12: 0 }; // step -> semitone, a short descending riff
  var MUSIC_BASS_STEPS = [0, 10];  // syncopated 808 hits
  var MUSIC_HAT_SKIP = { 7: true, 11: true }; // leave a couple steps open for swing
  var MUSIC_BASE_BPM = 130; // trap tempo
  var MUSIC_BPM_PER_LEVEL = 6;
  var MUSIC_MAX_BPM = 200;
  var musicOn = false;
  var musicTimeoutId = null;

  function musicLeadFreq(semi){
    return MUSIC_LEAD_ROOT * Math.pow(2, semi / 12);
  }
  function currentMusicBPM(){
    return Math.min(MUSIC_MAX_BPM, MUSIC_BASE_BPM + (level - 1) * MUSIC_BPM_PER_LEVEL);
  }
  function playHat(startTime, accent){
    playNoiseBurst(startTime, 0.045, accent ? 0.10 : 0.055);
  }
  function playBass808(startTime, secPerStep){
    var dur = secPerStep * 3.4;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(MUSIC_BASS_ROOT * 1.5, startTime);
    osc.frequency.exponentialRampToValueAtTime(MUSIC_BASS_ROOT * 0.6, startTime + secPerStep * 3.2);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.32, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.02);
  }
  function scheduleMusicLoop(){
    if (!musicOn || !audioCtx) return;
    var secPerStep = (60 / currentMusicBPM()) / 4;
    var startAt = audioCtx.currentTime + 0.05;
    for (var step = 0; step < MUSIC_STEPS_PER_BAR; step++){
      var stepTime = startAt + step * secPerStep;
      if (!MUSIC_HAT_SKIP[step]) playHat(stepTime, step % 4 === 0);
      if (MUSIC_BASS_STEPS.indexOf(step) !== -1) playBass808(stepTime, secPerStep);
      if (MUSIC_LEAD_STEPS.hasOwnProperty(step)){
        playTone(stepTime, musicLeadFreq(MUSIC_LEAD_STEPS[step]), secPerStep * 2.2, { type: "triangle", gain: 0.1 });
      }
    }
    var barDuration = MUSIC_STEPS_PER_BAR * secPerStep;
    musicTimeoutId = window.setTimeout(scheduleMusicLoop, barDuration * 1000);
  }
  function startMusic(){
    if (!ensureAudio() || musicOn) return;
    musicOn = true;
    scheduleMusicLoop();
  }
  function stopMusic(){
    musicOn = false;
    if (musicTimeoutId){
      window.clearTimeout(musicTimeoutId);
      musicTimeoutId = null;
    }
  }

  // ---------- decorative background (sidewalk scrolls to sell forward motion) ----------
  var SIDE_BLOCK = (SIDE_R - SIDE_L) / 2; // 2 columns, square cells
  var scrollY = 0;
  var grassDecor = [];
  var streetFurniture = []; // lamps, benches, mailboxes -- placed with guaranteed
                             // non-overlapping gaps, see buildFurnitureSide below

  function randomDecorX(side, r){
    if (side === 1){
      var minX = 3 + r, maxX = MARGIN - 3 - r;
      return minX + Math.random()*Math.max(1, maxX-minX);
    }
    var minX2 = SIDE_R + 3 + r, maxX2 = W - 3 - r;
    return minX2 + Math.random()*Math.max(1, maxX2-minX2);
  }

  function buildScenery(){
    scrollY = 0;

    grassDecor = [];
    // scale decor count with how wide the grass strips actually are, so a
    // widened border (on a proportionally wider screen) doesn't look sparse
    var densityMult = Math.max(1, Math.min(4, MARGIN / 30));
    var kinds = [];
    for (var b=0;b<Math.round(8*densityMult);b++) kinds.push("bush");
    for (var f=0;f<Math.round(16*densityMult);f++) kinds.push("flower");
    for (var g=0;g<Math.round(10*densityMult);g++) kinds.push("tuft");
    kinds.forEach(function(kind, i){
      var side = i % 2 === 0 ? 1 : -1;
      var r = kind === "bush" ? (10 + Math.random()*6)
        : kind === "flower" ? (5 + Math.random()*3)
        : (4 + Math.random()*4);
      grassDecor.push({ kind: kind, side: side, r: r, x: randomDecorX(side, r), y: Math.random()*H });
    });

    // lamps, benches and mailboxes are placed as a separate collision-aware
    // system (see buildFurnitureSide) so the three kinds never overlap
    streetFurniture = buildFurnitureSide(1).concat(buildFurnitureSide(-1));
  }

  function scrollScenery(dt, speed){
    scrollY += speed*dt;
    grassDecor.forEach(function(d){
      d.y += speed*dt;
      if (d.y - d.r > H + 20){
        d.y = -20 - Math.random()*100;
        d.x = randomDecorX(d.side, d.r);
      }
    });
    streetFurniture.forEach(function(f){
      f.y += speed*dt;
      if (f.y - f.topExt > H + 20){
        respawnFurniture(f);
      }
    });
  }

  // blocky pixel-art bush: a deterministic dithered circle of square blocks
  // (same technique as the sprites -- flat filled squares, no curves)
  function drawBush(cx, cy, r){
    var block = 4;
    var n = Math.ceil(r/block);
    for (var iy=-n; iy<=n; iy++){
      for (var ix=-n; ix<=n; ix++){
        var bx = ix*block, by = iy*block*1.15;
        var dist = Math.sqrt(bx*bx + by*by);
        if (dist <= r){
          var highlight = bx < 0 && by < -r*0.15 && dist < r*0.75;
          ctx.fillStyle = highlight ? "#6b9a4a" : "#4a7a34";
          ctx.fillRect(Math.round(cx+bx-block/2), Math.round(cy+iy*block-block/2), block, block);
        }
      }
    }
  }

  // blocky pixel-art flower: four square petals plus a center block
  function drawFlower(cx, cy, r){
    var block = Math.max(3, Math.round(r*0.5));
    ctx.fillStyle = "#e8c93c";
    ctx.fillRect(Math.round(cx-block/2), Math.round(cy-block*1.4), block, block);
    ctx.fillRect(Math.round(cx-block/2), Math.round(cy+block*0.4), block, block);
    ctx.fillRect(Math.round(cx-block*1.4), Math.round(cy-block/2), block, block);
    ctx.fillRect(Math.round(cx+block*0.4), Math.round(cy-block/2), block, block);
    ctx.fillStyle = "#8a5a1e";
    ctx.fillRect(Math.round(cx-block/2), Math.round(cy-block/2), block, block);
  }

  // blocky pixel-art park bench, seen from above -- oriented so the backrest
  // sits on the outer (grass) edge and the seat sits toward the sidewalk,
  // i.e. the bench faces the sidewalk rather than sitting side-on to it.
  // The back/seat widths and their offsets from cx are all scaled together
  // (2x the original depth) -- furnitureHalfWidths() below mirrors these
  // exact multipliers so placement code knows the bench's real footprint.
  function drawBench(cx, cy, r, side){
    var block = Math.max(2, Math.round(r*0.22));
    var len = block*14; // extent running alongside the sidewalk
    var y0 = Math.round(cy - len/2);

    // "side" already points toward the sidewalk (same convention the
    // streetlight arm uses), so a positive offset along it puts the seat
    // toward the sidewalk and a negative offset puts the backrest away from it
    var backW = block*3, backX = Math.round(cx + side*(-block*2.2) - backW/2);
    ctx.fillStyle = "#4a3320";
    ctx.fillRect(backX, y0, backW, len);

    var seatW = block*4.4, seatX = Math.round(cx + side*(block*0.6) - seatW/2);
    ctx.fillStyle = "#8a5a34";
    ctx.fillRect(seatX, y0, seatW, len);
    ctx.fillStyle = "#4a3320";
    ctx.fillRect(seatX, y0-block*0.6, seatW, block*0.6); // legs at each end
    ctx.fillRect(seatX, y0+len, seatW, block*0.6);
  }

  // big blue USPS-style relay mailbox: a tall blocky box sitting on the
  // ground (no thin post or little flag -- the big kind, not a house mailbox)
  function drawMailbox(cx, cy, r){
    var block = Math.max(2, Math.round(r*0.26));
    var w = block*5, h = block*8;
    var x0 = Math.round(cx - w/2), y0 = Math.round(cy - h/2);
    ctx.fillStyle = "#1d4fc4";
    ctx.fillRect(x0, y0+block, w, h-block);                    // main body
    ctx.fillRect(x0+block*0.4, y0, w-block*0.8, block*1.3);    // domed top
    ctx.fillStyle = "#12327d";
    ctx.fillRect(x0, y0+h-block*1.1, w, block*1.1);            // base shadow
    ctx.fillRect(x0, y0+block*2.6, w, block*0.5);              // mail-slot ledge
    ctx.fillStyle = "#0a1e52";
    ctx.fillRect(x0+w*0.5-block*0.4, y0+block*3.4, block*0.8, block*0.5); // handle
  }

  var LAMP_SCALE = 4;        // lamps drawn 4x their original size

  // blocky pixel-art streetlight: a stepped (staircase) pixel arm instead of
  // a smooth curve, and a squared-off dithered glow instead of a radial one.
  // Lit (warm glow, cream bulb) at night; unlit (cool grey glass) by day.
  function drawStreetlight(cx, groundY, side, daytime){
    var S = LAMP_SCALE;
    ctx.fillStyle = "#2b2b2b";
    ctx.fillRect(cx-1.5*S, groundY-30*S, 3*S, 30*S);
    ctx.fillRect(cx, groundY-31*S, side*S*3, S*2);
    ctx.fillRect(cx+side*S*3, groundY-33*S, side*S*3, S*2);
    ctx.fillRect(cx+side*S*6, groundY-34*S, side*S*4, S*2);
    ctx.fillRect(cx+side*S*10, groundY-34*S, side*S*3, S*2);

    var lampX = cx + side*S*13, lampY = groundY-33*S;
    if (!daytime){
      ctx.fillStyle = "rgba(255,232,150,0.16)";
      ctx.fillRect(lampX-S*5, lampY-S*5, S*10, S*10);
      ctx.fillStyle = "rgba(255,232,150,0.26)";
      ctx.fillRect(lampX-S*3, lampY-S*3, S*6, S*6);
      ctx.fillStyle = "rgba(255,232,150,0.42)";
      ctx.fillRect(lampX-S*1.5, lampY-S*1.5, S*3, S*3);
    }

    ctx.fillStyle = daytime ? "#5a6b78" : "#3a3a3a";
    ctx.fillRect(lampX-S*2, lampY-S*2, S*4, S*4);
    ctx.fillStyle = daytime ? "#cfe0e8" : "#fff3c4";
    ctx.fillRect(lampX-S, lampY-S, S*2, S*2);
  }

  // ---------- street furniture (lamps, benches, mailboxes) ----------
  // These three kinds are placed as a single collision-aware system, unlike
  // the bushes/flowers/tufts above: each item tracks its own vertical extent
  // (topExt/botExt, distance from its anchor y) and both the initial build
  // and every respawn enforce a minimum clear gap between items on the same
  // side, so lamps, benches and mailboxes can never overlap each other.
  var FURNITURE_MIN_GAP = 40; // minimum clear gap between furniture edges

  function furnitureExtents(kind, r){
    if (kind === "lamp"){
      var S = LAMP_SCALE;
      return { top: 38*S, bottom: 0 }; // groundY is the bottom-most pixel already
    }
    if (kind === "bench"){
      var block = Math.max(2, Math.round(r*0.22));
      var half = block*7 + block*0.6; // half of len (block*14) plus leg allowance
      return { top: half, bottom: half };
    }
    // mailbox
    var blockM = Math.max(2, Math.round(r*0.26));
    var halfM = blockM*4; // half of h (block*8)
    return { top: halfM, bottom: halfM };
  }

  // horizontal reach from a bench/mailbox's anchor x -- "inner" toward the
  // sidewalk, "outer" toward the grass's outside edge. Mirrors the exact
  // multipliers drawBench/drawMailbox use so the safe placement zone below
  // matches what's actually drawn, keeping both kinds fully on the grass
  function furnitureHalfWidths(kind, r){
    if (kind === "mailbox"){
      var blockM = Math.max(2, Math.round(r*0.26));
      var half = blockM*2.5; // half of w (block*5), symmetric
      return { inner: half, outer: half };
    }
    // bench: asymmetric -- seat (toward sidewalk) reaches side*0.6block +/- 2.2block,
    // backrest (toward grass edge) reaches side*-2.2block +/- 1.5block
    var block = Math.max(2, Math.round(r*0.22));
    return { inner: block*2.8, outer: block*3.7 };
  }

  // pick an x for a bench/mailbox that keeps its whole footprint on the
  // grass strip -- clamped so the sidewalk-facing edge never crosses into
  // the sidewalk, even on the narrowest screens where there's little slack
  function randomFurnitureX(kind, side, r){
    var hw = furnitureHalfWidths(kind, r);
    var clearance = 2;
    if (side === 1){
      var minX = clearance + hw.outer, maxX = MARGIN - clearance - hw.inner;
      if (maxX <= minX) return MARGIN - hw.inner; // too tight for slack -- hug the sidewalk-safe edge exactly
      return minX + Math.random()*(maxX-minX);
    }
    var minX2 = SIDE_R + clearance + hw.inner, maxX2 = W - clearance - hw.outer;
    if (maxX2 <= minX2) return SIDE_R + hw.inner;
    return minX2 + Math.random()*(maxX2-minX2);
  }

  function pickFurnitureKind(){
    var rnd = Math.random();
    if (rnd < 0.35) return "skip";  // stretch of plain grass, keeps it from feeling like a fence
    if (rnd < 0.70) return "lamp";
    if (rnd < 0.85) return "bench";
    return "mailbox";
  }

  // walk a cursor down one side of the sidewalk, placing lamps/benches/
  // mailboxes back-to-back with a guaranteed gap between them -- called once
  // per side at build time, covering well past the bottom of the screen so
  // scrolling never runs out of pre-placed items before a respawn can happen
  function buildFurnitureSide(side){
    var arr = [];
    var y = -80 - Math.random()*150;
    var yLimit = H + 400;
    while (y < yLimit){
      var kind = pickFurnitureKind();
      if (kind === "skip"){
        y += FURNITURE_MIN_GAP + 60 + Math.random()*160;
        continue;
      }
      var r = kind === "bench" ? (16 + Math.random()*4) : kind === "mailbox" ? (20 + Math.random()*4) : 0;
      var ext = furnitureExtents(kind, r);
      var itemY = y + ext.top;
      var x = kind === "lamp" ? (side === 1 ? 14 : W-14) : randomFurnitureX(kind, side, r);
      arr.push({ kind: kind, side: side, x: x, y: itemY, r: r, topExt: ext.top, botExt: ext.bottom });
      y = itemY + ext.bottom + FURNITURE_MIN_GAP + Math.random()*160;
    }
    return arr;
  }

  // respawn one item above the current topmost item on its own side, so the
  // no-overlap guarantee from the initial build holds forever as items cycle
  function respawnFurniture(item){
    var topEdge = 0;
    streetFurniture.forEach(function(o){
      if (o.side === item.side && o !== item){
        var oTop = o.y - o.topExt;
        if (oTop < topEdge) topEdge = oTop;
      }
    });
    var gap = FURNITURE_MIN_GAP + Math.random()*160;
    if (item.kind !== "lamp"){
      item.r = item.kind === "bench" ? (16 + Math.random()*4) : (20 + Math.random()*4);
      var ext = furnitureExtents(item.kind, item.r);
      item.topExt = ext.top;
      item.botExt = ext.bottom;
      item.x = randomFurnitureX(item.kind, item.side, item.r);
    }
    item.y = topEdge - gap - item.topExt;
  }

  // flat fill dithered with a deterministic scatter of blocks in a second
  // shade -- same flat-color, hard-edged technique as the sprites, instead
  // of a smooth gradient
  function pixelNoiseFill(x0, y0, w, h, base, alt, block, density, scrollOffset){
    ctx.fillStyle = base;
    ctx.fillRect(x0, y0, w, h);
    ctx.fillStyle = alt;
    var off = scrollOffset || 0;
    var gx0 = Math.floor(x0/block), gx1 = Math.ceil((x0+w)/block);
    var gy0 = Math.floor((y0-off)/block), gy1 = Math.ceil((y0+h-off)/block);
    for (var gy=gy0; gy<gy1; gy++){
      for (var gx=gx0; gx<gx1; gx++){
        var hash = Math.abs((gx*92821 + gy*68917 + gx*gy*2654435761) % 1000);
        if (hash < density*1000){
          ctx.fillRect(gx*block, gy*block+off, block, block);
        }
      }
    }
  }

  function drawBackground(){
    // grass -- flat color with a dithered fleck pattern, pixel-art style,
    // scrolling with everything else so it doesn't sit still under the
    // sidewalk grid and flowers
    pixelNoiseFill(0, 0, W, H, "#5c8a3a", "#6b9a44", SCALE*2, 0.14, scrollY);

    // concrete sidewalk -- same dithered fleck technique as the grass, in a
    // light grey pair, scrolling with everything else
    pixelNoiseFill(SIDE_L, 0, SIDE_R-SIDE_L, H, "#d8d0b8", "#c9c6ba", SCALE*2, 0.14, scrollY);

    // expansion joints -- 2 square columns; rows scroll down as she walks forward
    ctx.strokeStyle = "rgba(150,138,110,.55)";
    ctx.lineWidth = SCALE*0.7;
    var rowOffset = scrollY % SIDE_BLOCK;
    for (var y=rowOffset; y<H; y+=SIDE_BLOCK){
      ctx.beginPath();
      ctx.moveTo(SIDE_L+2, y);
      ctx.lineTo(SIDE_R-2, y);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(SIDE_L+SIDE_BLOCK, 0);
    ctx.lineTo(SIDE_L+SIDE_BLOCK, H);
    ctx.stroke();

    // bushes, shrubs and flowers on the grass, also scrolling
    grassDecor.forEach(function(d){
      if (d.kind === "tuft"){
        ctx.fillStyle = "#3a5a22";
        ctx.fillRect(Math.round(d.x-3), Math.round(d.y-d.r), 2, Math.max(2,d.r));
        ctx.fillRect(Math.round(d.x+1), Math.round(d.y-d.r*0.75), 2, Math.max(2,d.r*0.75));
      } else if (d.kind === "bush"){
        drawBush(d.x, d.y, d.r);
      } else {
        drawFlower(d.x, d.y, d.r);
      }
    });

    // lamps, benches and mailboxes -- lit/unlit lamps depending on time of
    // day, all three kinds placed with guaranteed non-overlapping gaps
    var daytime = !nightMode;
    streetFurniture.forEach(function(f){
      if (f.kind === "lamp"){
        drawStreetlight(f.x, f.y, f.side, daytime);
      } else if (f.kind === "bench"){
        drawBench(f.x, f.y, f.r, f.side);
      } else {
        drawMailbox(f.x, f.y, f.r);
      }
    });
  }

  // ---------- game state ----------
  var STATE_READY = "ready", STATE_PLAYING = "playing", STATE_PAUSED = "paused", STATE_OVER = "over", STATE_HIGHSCORES = "highscores";
  var state = STATE_READY;

  var girl = { x: W/2, y: GIRL_Y_START, vx: 0, walking:false, swatterCount:0, hasBubble:false };
  var bugs = [];
  var powerUps = [];
  var t = 0;              // real survival time (s)
  var steps = 0;          // steps taken -- climbs much faster than real time (STEPS_PER_SECOND)
  var score = 0;          // Mental Health Score = steps + killScore
  var bugKills = 0;
  var killScore = 0;      // total points earned from kills so far
  var scorePopups = [];   // floating "+x" pink text, one per kill, at the kill spot
  var swatterKills = 0;   // bugs killed by absorbing a hit with a fly swatter equipped
  var roachKills = 0;     // cockroaches killed, any method
  var nightKills = 0;     // bugs killed while their night variant, any method
  var level = 1;
  var lastBeeLevel = 0;    // most recent even level a bee was already spawned for
  var spawnTimer = 0;
  var powerUpTimer = 12;
  var zapTimer = 0;
  var zapScale = 1;       // zap effect grows 1.1x each time a swatter charge is used (absorbing a hit)
  var bubbleScale = 1;    // kill-bubble radius grows 1.1x with each pill pickup
  var swingFreezeTimer = 0; // >0 while the swing animation plays; world is paused
  var nightMode = false;    // whether the blue night filter is currently on
  var nightCycle = 0;       // which 10k-step block we're in -- odd = night, even = day
  var nightFreezeTimer = 0; // >0 during the quick day/night transition pause
  var nightBannerTimer = 0;
  var pickupPulse = 0;
  var bubbleTimer = 0;
  var coffeeTimer = 0;    // >0 while the iced coffee speed boost is active
  var animTimer = 0;
  var animFrame = 0;
  var shake = 0;

  var keyLeft = false, keyRight = false;
  var dragging = false, pointerTargetX = null;

  var MAX_SPEED = 330;
  var ACCEL = 2100;
  var FRICTION = 2400;

  function resetGame(){
    stopBubbleAmbient();
    stopMusic();
    stopDeathBuzz();
    screenWrap.classList.remove("death");
    girl.x = W/2; girl.y = GIRL_Y_START; girl.vx = 0; girl.walking = false;
    girl.swatterCount = 0; girl.hasBubble = false;
    bugs = [];
    powerUps = [];
    t = 0; steps = 0; score = 0; bugKills = 0; killScore = 0; scorePopups = []; swatterKills = 0; roachKills = 0; nightKills = 0; level = 1; lastBeeLevel = 0;
    spawnTimer = 0.6;
    powerUpTimer = 6.25 + Math.random()*3.75; // 25% less often than before
    zapTimer = 0; zapScale = 1; bubbleScale = 1; pickupPulse = 0; bubbleTimer = 0; coffeeTimer = 0; swingFreezeTimer = 0;
    nightMode = false; nightCycle = 0; nightFreezeTimer = 0; nightBannerTimer = 0;
    if (nightBanner) nightBanner.classList.remove("show", "night", "day");
    animTimer = 0; animFrame = 0;
    shake = 0;
    buildScenery();
  }

  function difficultyForLevel(lv){
    return {
      spawnInterval: Math.max(0.26, 1.15 - (lv-1)*0.09),
      bugSpeed: Math.min(320, 85 + (lv-1)*13),
      scoreRate: 10 + (lv-1)*4,
      bugsPerSpawn: 1 + Math.min(2, Math.floor(lv/6))
    };
  }

  function spawnBugs(){
    var diff = difficultyForLevel(level);
    for (var i=0;i<diff.bugsPerSpawn;i++){
      if (bugs.length >= MAX_BUGS_ON_SCREEN) break;
      var kind = Math.random() < 0.5 ? "roach" : "fly";
      var w = kind === "roach" ? ROACH_W : FLY_W;
      var h = kind === "roach" ? ROACH_H : FLY_H;
      // roaches march straight down a lane; every fly weaves the same zigzag
      var amp = kind === "roach" ? 0 : FLY_ZIGZAG_AMP;
      var minX = SIDE_L + w/2 + 2 + amp;
      var maxX = SIDE_R - w/2 - 2 - amp;
      var baseX = minX + Math.random()*Math.max(1, maxX-minX);
      bugs.push({
        kind: kind,
        w: w, h: h,
        baseX: baseX,
        x: baseX,
        y: -h - Math.random()*60,
        speed: diff.bugSpeed * (kind === "roach" ? (0.8 + Math.random()*0.2) : (1.0 + Math.random()*0.3)),
        amp: amp,
        freq: kind === "roach" ? 0 : FLY_ZIGZAG_FREQ,
        phase: Math.random()*Math.PI*2,
        tt: 0,
        // whichever it was at the moment it spawned in -- bugs already on
        // screen don't flip look mid-flight when day/night flips
        nightVariant: nightMode,
        trail: kind === "roach" ? null : [] // roaches crawl on the ground, no flight trail
      });
    }
  }

  var BEE_SPEED = 150; // px/sec along its straight line toward the spawn-time target

  // special enemy that shows up every two levels: it dive-bombs in a straight
  // line from the top of the map toward wherever the girl was standing the
  // instant it spawned -- not a live homing target, just a fixed aim point
  function spawnBee(){
    var minX = SIDE_L + FLY_W/2 + 2;
    var maxX = SIDE_R - FLY_W/2 - 2;
    var startX = minX + Math.random()*Math.max(1, maxX-minX);
    var startY = -FLY_H - 10;
    var targetX = girl.x, targetY = girl.y + GIRL_H*0.5;
    var dx = targetX - startX, dy = targetY - startY;
    var dist = Math.max(1, Math.sqrt(dx*dx + dy*dy));
    bugs.push({
      kind: "bee",
      w: FLY_W, h: FLY_H,
      baseX: startX, x: startX, y: startY,
      vx: (dx/dist) * BEE_SPEED,
      vy: (dy/dist) * BEE_SPEED,
      speed: BEE_SPEED,
      amp: 0, freq: 0, phase: 0, tt: 0,
      nightVariant: nightMode,
      trail: []
    });
  }

  function spawnPowerUp(){
    var r = Math.random();
    // coffee spawns half as often as the swatter or the pill (2:2:1 weighting)
    var type = r < 0.4 ? "swatter" : r < 0.8 ? "bubble" : "coffee";
    var w = type === "swatter" ? SWATTER_W : type === "bubble" ? PILL_W : COFFEE_W;
    var h = type === "swatter" ? SWATTER_H : type === "bubble" ? PILL_H : COFFEE_H;
    var minX = SIDE_L + w/2 + 2;
    var maxX = SIDE_R - w/2 - 2;
    powerUps.push({
      type: type,
      x: minX + Math.random()*Math.max(1, maxX-minX),
      y: -h - 20,
      w: w, h: h,
      speed: 78
    });
  }

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  function smoothstep(x){
    x = Math.max(0, Math.min(1, x));
    return x*x*(3-2*x);
  }

  // Mental Health Score = steps taken + points banked from kills so far
  function recomputeScore(){
    score = steps + killScore;
  }

  // every POINTS_DOUBLE_EVERY_STEPS taken this run, every point value
  // (kill points and the coffee bonus alike) doubles again -- 1x for the
  // first 10k steps, 2x for the next 10k, 4x after that, and so on
  function pointsMultiplier(){
    return Math.pow(2, Math.floor(steps / POINTS_DOUBLE_EVERY_STEPS));
  }

  // display steps/score as a compact "x.xxK" figure
  function formatK(n){
    return (n / 1000).toFixed(2) + "K";
  }

  var SCORE_POPUP_DURATION = 0.6; // seconds the floating "+x" text lives for

  // floating pink "+x" text that pops up right where a bug died, then
  // drifts up and fades out
  function spawnScorePopup(x, y, points){
    scorePopups.push({ x: x, y: y, points: points, timer: SCORE_POPUP_DURATION });
  }

  // tally a kill toward the relevant lifetime-best stats, bank its points
  // bank points by kind (roach/"beetle" < fly/moth < bee), scaled by how
  // many times steps have crossed the 10k doubling threshold this run,
  // pop the "+x" text where it died, and play the squish
  function registerKill(b, viaSwatter){
    bugKills++;
    if (viaSwatter) swatterKills++;
    if (b.kind === "roach") roachKills++;
    if (b.nightVariant) nightKills++;
    var base = b.kind === "roach" ? ROACH_KILL_SCORE : b.kind === "bee" ? BEE_KILL_SCORE : FLY_KILL_SCORE;
    var pts = Math.round(base * pointsMultiplier());
    killScore += pts;
    spawnScorePopup(b.x, b.y + b.h*0.5, pts);
    playSquishSound();
  }

  // she got touched by a bug but has a fly swatter equipped -- instead of
  // ending the game, it auto-zaps everything inside the yellow half-oval zap
  // zone above her, AND the bug(s) that actually touched her always die too
  // even if they happen to fall just outside that ellipse -- burns one charge
  // no matter how many bugs go down
  function absorbHit(hitBugs){
    girl.swatterCount--;
    zapScale *= 1.1; // the zap effect grows each time a charge is actually used, not when picked up
    zapTimer = 0.28;
    swingFreezeTimer = SWING_DURATION;
    playZapSound();
    var zcx = girl.x, zcy = girl.y + GIRL_H*ZAP_CENTER_Y_OFFSET;
    var zRadius = ZAP_RADIUS*zapScale;
    var zRx = zRadius*ZAP_SIDE_MULT, zRy = zRadius*ZAP_FORWARD_MULT;

    var toKill = hitBugs.slice(); // whatever actually touched her always dies
    for (var i=0; i<bugs.length; i++){
      var b = bugs[i];
      if (toKill.indexOf(b) !== -1) continue;
      var bcx = b.x, bcy = b.y + b.h*0.5;
      var dx = bcx-zcx, dy = bcy-zcy;
      // only the upper half of the ellipse counts -- the yellow half-oval flash
      if (dy <= 0 && (dx*dx)/(zRx*zRx) + (dy*dy)/(zRy*zRy) <= 1){
        toKill.push(b);
      }
    }

    toKill.forEach(function(b){
      var idx = bugs.indexOf(b);
      if (idx !== -1) bugs.splice(idx, 1);
      registerKill(b, true);
    });
  }

  function update(dt){
    if (state !== STATE_PLAYING) return;

    // floating "+x" popups keep drifting/fading even through the brief
    // swing/night-transition pauses below, so they never look frozen
    for (var sp=scorePopups.length-1; sp>=0; sp--){
      scorePopups[sp].timer -= dt;
      if (scorePopups[sp].timer <= 0) scorePopups.splice(sp, 1);
    }

    if (swingFreezeTimer > 0){
      swingFreezeTimer = Math.max(0, swingFreezeTimer - dt);
      if (zapTimer > 0) zapTimer = Math.max(0, zapTimer - dt);
      return; // world pauses for the swing -- bugs, scenery, spawns and score all hold still
    }

    if (nightFreezeTimer > 0){
      nightFreezeTimer = Math.max(0, nightFreezeTimer - dt);
      if (nightBannerTimer > 0){
        nightBannerTimer = Math.max(0, nightBannerTimer - dt);
        nightBanner.classList.toggle("show", nightBannerTimer > 0);
      }
      return; // quick pause for the day-to-night transition
    }

    t += dt;
    steps = t * STEPS_PER_SECOND;
    var diff = difficultyForLevel(level);
    recomputeScore();

    var newLevel = 1 + Math.floor(steps / STEPS_PER_LEVEL);
    if (newLevel !== level){
      level = newLevel;
      if (level % 2 === 0 && level !== lastBeeLevel){
        spawnBee();
        lastBeeLevel = level;
      }
    }

    var curNightCycle = Math.floor(steps / NIGHT_CYCLE_STEPS);
    if (curNightCycle !== nightCycle){
      nightCycle = curNightCycle;
      nightMode = (nightCycle % 2 === 1);
      nightFreezeTimer = NIGHT_TRANSITION_DURATION;
      nightBannerTimer = NIGHT_TRANSITION_DURATION;
      nightBanner.textContent = nightMode ? "Tomorrow steps!" : "Good morning beautiful ;)";
      nightBanner.classList.toggle("night", nightMode);
      nightBanner.classList.toggle("day", !nightMode);
      nightBanner.classList.add("show");
      return; // pause immediately so the day/night banner reads clearly
    }

    // sidewalk and grass decor scroll down so she reads as walking forward
    scrollScenery(dt, Math.min(150, 60 + (level-1)*4));

    if (zapTimer > 0) zapTimer = Math.max(0, zapTimer - dt);
    if (pickupPulse > 0) pickupPulse = Math.max(0, pickupPulse - dt);

    // input -> girl motion (left/right only) -- the iced coffee boost scales
    // her top speed (and how fast a drag-to-position catches up) by 25%
    var curMaxSpeed = MAX_SPEED * (coffeeTimer > 0 ? COFFEE_SPEED_MULT : 1);
    if (dragging && pointerTargetX !== null){
      var dist = pointerTargetX - girl.x;
      var step = Math.sign(dist) * Math.min(Math.abs(dist), curMaxSpeed*1.6*dt);
      girl.x += step;
      girl.vx = step/dt || 0;
      girl.walking = Math.abs(dist) > 2;
    } else {
      var dir = (keyRight?1:0) - (keyLeft?1:0);
      if (dir !== 0){
        girl.vx += dir*ACCEL*dt;
        girl.vx = Math.max(-curMaxSpeed, Math.min(curMaxSpeed, girl.vx));
        girl.walking = true;
      } else {
        var sign = girl.vx > 0 ? -1 : 1;
        girl.vx += sign*FRICTION*dt;
        if ((sign===-1 && girl.vx<0) || (sign===1 && girl.vx>0)) girl.vx = 0;
        girl.walking = Math.abs(girl.vx) > 6;
      }
      girl.x += girl.vx*dt;
    }
    if (girl.x < GIRL_MIN_X){ girl.x = GIRL_MIN_X; girl.vx = 0; }
    if (girl.x > GIRL_MAX_X){ girl.x = GIRL_MAX_X; girl.vx = 0; }

    // spawn bugs (capped so density stops climbing once the screen is full)
    spawnTimer -= dt;
    if (spawnTimer <= 0){
      if (bugs.length < MAX_BUGS_ON_SCREEN) spawnBugs();
      spawnTimer = diff.spawnInterval * (0.85 + Math.random()*0.3);
    }

    // occasional power-up: the electric swatter or the pink kill-bubble pill
    // (keeps showing up even if she's already holding one)
    powerUpTimer -= dt;
    if (powerUpTimer <= 0){
      if (powerUps.length === 0){
        spawnPowerUp();
        powerUpTimer = 10 + Math.random()*6.25; // 25% less often than before
      } else {
        powerUpTimer = 2;
      }
    }
    if (bubbleTimer > 0){
      bubbleTimer = Math.max(0, bubbleTimer - dt);
      if (bubbleTimer === 0){
        girl.hasBubble = false;
        stopBubbleAmbient();
      }
    }
    if (coffeeTimer > 0) coffeeTimer = Math.max(0, coffeeTimer - dt);
    // her FULL sprite bounding box counts for power-up pickups -- any part
    // of her touching the item collects it, not just a narrow center band
    var girlHalfWP = GIRL_W*0.5, girlHalfHP = GIRL_H*0.5;
    var gxP = girl.x - girlHalfWP, gyP = girl.y;
    for (var p=powerUps.length-1; p>=0; p--){
      var pu = powerUps[p];
      pu.y += pu.speed*dt;
      if (pu.y > H + pu.h){ powerUps.splice(p,1); continue; }
      // every power-up uses the same ITEM_R hit radius, regardless of its
      // own sprite's pixel dimensions, matching the glow circle drawn
      // around it -- consistent, and bigger than the old per-sprite box
      var puHalfW = ITEM_R, puHalfH = ITEM_R;
      var pux = pu.x - puHalfW, puy = pu.y + pu.h*0.5 - puHalfH;
      if (rectsOverlap(gxP,gyP,girlHalfWP*2,girlHalfHP*2, pux,puy,puHalfW*2,puHalfH*2)){
        if (pu.type === "swatter"){
          girl.swatterCount++;
        } else if (pu.type === "bubble"){
          girl.hasBubble = true;
          bubbleTimer = BUBBLE_DURATION;
          bubbleScale *= 1.1;
          playPillSound();
          startBubbleAmbient();
        } else {
          coffeeTimer = COFFEE_DURATION;
          var coffeePts = Math.round(COFFEE_SCORE_BONUS * pointsMultiplier());
          killScore += coffeePts;
          spawnScorePopup(pu.x, pu.y + pu.h*0.5, coffeePts);
          playSlurpSound();
        }
        pickupPulse = 0.5;
        powerUps.splice(p,1);
      }
    }

    // move bugs + collide -- only her head is a hazard, so a bug that's
    // visually behind her body/dress doesn't kill her
    var girlHalfW = GIRL_W*0.22, girlHalfH = GIRL_H*0.11;
    var gx = girl.x - girlHalfW, gy = girl.y + GIRL_H*0.16 - girlHalfH;

    var bubbleCX = girl.x, bubbleCY = girl.y + GIRL_H*0.5;
    var hitBugs = []; // bug(s) that actually touched her this frame -- resolved as one AOE zap after the loop

    // the iced coffee boost speeds up every bug on screen too (fall speed,
    // zigzag/flutter rate, and the bee's dive), not just her -- a raw speed
    // multiplier on their motion is always visible, unlike her own dragged
    // movement which can be capped by how fast a finger is actually moving
    var bugSpeedMult = coffeeTimer > 0 ? COFFEE_SPEED_MULT : 1;

    for (var i=bugs.length-1; i>=0; i--){
      var b = bugs[i];
      if (b.kind === "bee"){
        b.tt += dt*bugSpeedMult;
        // straight line toward the fixed spawn-time target, not a live homing chase
        b.x += b.vx*bugSpeedMult*dt;
        b.y += b.vy*bugSpeedMult*dt;
      } else {
        // tt accumulates DISTANCE fallen (not time) here, matching the y
        // step exactly -- see FLY_ZIGZAG_FREQ above for why: it's what
        // keeps the weave's shape the same regardless of how fast this
        // particular bug is falling
        var fallStep = b.speed*bugSpeedMult*dt;
        b.y += fallStep;
        b.tt += fallStep;
        b.x = b.baseX + Math.sin(b.phase + b.tt*b.freq) * b.amp;
      }

      // flight-path trail for flies/moths/bees (roaches have trail===null
      // and are skipped) -- keep recent points, trimmed by traveled
      // distance rather than a frame count, to roughly 5 body-widths long
      if (b.trail){
        b.trail.push({ x: b.x, y: b.y });
        var maxTrailLen = b.w * 5;
        var trailDist = 0, cut = 0;
        for (var ti=b.trail.length-1; ti>0; ti--){
          var pA=b.trail[ti], pB=b.trail[ti-1];
          trailDist += Math.hypot(pA.x-pB.x, pA.y-pB.y);
          if (trailDist > maxTrailLen){ cut = ti; break; }
        }
        if (cut > 0) b.trail.splice(0, cut);
      }

      if (b.y > H + b.h){
        bugs.splice(i,1);
        continue;
      }

      if (girl.hasBubble){
        var bcx = b.x, bcy = b.y + b.h*0.5;
        var dx = bcx-bubbleCX, dy = bcy-bubbleCY;
        var curBubbleRadius = BUBBLE_RADIUS*bubbleScale;
        if (dx*dx + dy*dy < curBubbleRadius*curBubbleRadius){
          bugs.splice(i,1);
          registerKill(b, false);
          continue;
        }
      }

      var bugHalfW = b.w*0.34, bugHalfH = b.h*0.34;
      var bx = b.x - bugHalfW, by = b.y + b.h*0.5 - bugHalfH;
      if (rectsOverlap(gx,gy,girlHalfW*2,girlHalfH*2, bx,by,bugHalfW*2,bugHalfH*2)){
        if (girl.swatterCount > 0){
          // leave removal to absorbHit below -- it guarantees this exact bug
          // dies, plus anything else caught in the AOE zap sweep
          hitBugs.push(b);
        } else {
          gameOver();
          return;
        }
      }
    }

    // one zap use always kills whatever actually touched her, plus every
    // other bug in the yellow half-oval, and only burns a single charge no
    // matter how many bugs went down
    if (hitBugs.length > 0) absorbHit(hitBugs);

    recomputeScore();

    // anim -- her legs cycle noticeably faster while the coffee boost is
    // active, an always-visible "she's moving fast" tell that reads the
    // same regardless of whether she's being dragged or key-driven
    animTimer += dt;
    var wiggleSpeed = girl.walking ? (coffeeTimer > 0 ? 0.14/COFFEE_SPEED_MULT : 0.14) : 0.42;
    if (animTimer > wiggleSpeed){ animTimer = 0; animFrame = 1-animFrame; }
  }

  function gameOver(){
    state = STATE_OVER;
    shake = 0.35;
    stopBubbleAmbient();
    stopMusic();
    startDeathBuzz();
    // the fly-buzz drone is atmospheric but shouldn't loop forever if she
    // lingers on the DIVA DOWN screen -- fade it out after 10s
    var scoreAtBuzzStart = score;
    window.setTimeout(function(){
      if (state === STATE_OVER && score === scoreAtBuzzStart) stopDeathBuzz();
    }, 10000);
    screenWrap.classList.add("death");

    // snapshot the previous bests before updating them, so we know exactly
    // which record (if any) this run just broke
    var prevHighScore = highScore, prevHighSteps = highSteps;
    var prevBestSwatterKills = bestSwatterKills, prevBestRoachKills = bestRoachKills, prevBestNightKills = bestNightKills;

    var isBest = score > highScore;
    if (isBest) saveHighScore(score);
    if (steps > highSteps) saveHighSteps(steps);
    if (swatterKills > bestSwatterKills) saveBestSwatterKills(swatterKills);
    if (roachKills > bestRoachKills) saveBestRoachKills(roachKills);
    if (nightKills > bestNightKills) saveBestNightKills(nightKills);

    overlayTitleWrap.hidden = false;
    setOverlayTitle("DIVA DOWN", true);
    // restart the drop-in animation every time (remove + reflow + re-add),
    // since the class may already be present from a previous game over
    overlayTitleWrap.classList.remove("drop-in");
    void overlayTitleWrap.offsetWidth;
    overlayTitleWrap.classList.add("drop-in");
    overlayText.hidden = true;

    // only the single highest-priority record broken this run gets called out
    var flavor = "";
    if (steps > prevHighSteps){
      flavor = "Big Stepper! That's the farthest you've walked!";
    } else if (score > prevHighScore){
      flavor = "Mental Health Queen! Your best mental health score yet!";
    } else if (swatterKills > prevBestSwatterKills){
      flavor = "Fly swat warrior! Most bugs killed with fly swatter: " + swatterKills;
    } else if (roachKills > prevBestRoachKills){
      flavor = "Ready for the apocalypse! Most cockroaches killed: " + roachKills;
    } else if (nightKills > prevBestNightKills){
      flavor = "Nighttime ninja! Most bugs killed at night: " + nightKills;
    }
    flavorTextEl.textContent = flavor;
    flavorWatch.hidden = !flavor;

    // top/bottom split so her face stays clear in the middle: title +
    // flavor watch pinned up top, the run's watch + button pinned down
    // to the bottom (same treatment the ready screen uses)
    overlay.classList.add("split-layout");
    deathWatch.hidden = false;
    refreshDeathWatch(steps, score, Math.max(highSteps, steps), Math.max(highScore, score));
    startBtn.textContent = "Boogie Again";
    viewScoresBtn.hidden = false;
    highscoresPanel.hidden = true;
    hideNameEntry();
    showOverlay();
    refreshHud();

    // fetch a fresh copy of the worldwide top 10 before judging whether this
    // run's score cracks it -- a stale in-memory copy could wrongly prompt
    // (or wrongly skip prompting) if someone else's run landed in between
    var scoreAtDeath = score;
    fetchLeaderboard(function(){
      if (state !== STATE_OVER || score !== scoreAtDeath) return; // moved on already
      if (qualifiesForTop10(scoreAtDeath)) showNameEntry(scoreAtDeath);
    });
  }

  // plain text now, so this just needs a cheap textContent set when the
  // displayed value actually changes (skip the redundant DOM write on
  // frames where steps/mood haven't ticked over yet)
  var lastWatchSteps = null, lastWatchMood = null;
  function refreshHud(){
    var stepsText = formatK(steps);
    if (stepsText !== lastWatchSteps){
      lastWatchSteps = stepsText;
      hudSteps.textContent = stepsText;
    }
    var moodText = formatK(score);
    if (moodText !== lastWatchMood){
      lastWatchMood = moodText;
      hudMood.textContent = moodText;
    }
  }

  // ---------- render ----------
  function render(){
    ctx.save();
    if (shake > 0){
      var mag = shake*10;
      ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
    }
    drawBackground();

    bugs.forEach(function(b){
      // grey flight-path trail, drawn behind the sprite, fading out toward
      // the tail -- flat-color hard-edged segments, same technique as
      // everything else, rather than a smooth blurred streak
      if (b.trail && b.trail.length > 1){
        ctx.save();
        ctx.strokeStyle = "#8a8a86";
        ctx.lineWidth = Math.max(1.5, SCALE*0.6);
        ctx.lineCap = "round";
        for (var tj=1; tj<b.trail.length; tj++){
          ctx.globalAlpha = (tj / b.trail.length) * 0.5;
          ctx.beginPath();
          ctx.moveTo(b.trail[tj-1].x, b.trail[tj-1].y + b.h*0.5);
          ctx.lineTo(b.trail[tj].x, b.trail[tj].y + b.h*0.5);
          ctx.stroke();
        }
        ctx.restore();
      }
      if (b.kind === "roach"){
        var rf = animFrame === 0 ? ROACH_FRAME_A : ROACH_FRAME_B;
        drawSprite(ctx, rf, b.nightVariant ? ROACH_COLORS_NIGHT : ROACH_COLORS, b.x, b.y, SCALE);
      } else if (b.kind === "bee"){
        var bf = animFrame === 0 ? BEE_FRAME_A : BEE_FRAME_B;
        drawSpriteRotated(ctx, bf, BEE_COLORS, b.x, b.y, SCALE, b.h, bugHeadingAngle(b));
      } else if (b.nightVariant){
        var mf = animFrame === 0 ? MOTH_FRAME_A : MOTH_FRAME_B;
        drawSpriteRotated(ctx, mf, MOTH_COLORS, b.x, b.y, SCALE, b.h, bugHeadingAngle(b));
      } else {
        var ff = animFrame === 0 ? FLY_FRAME_A : FLY_FRAME_B;
        drawSpriteRotated(ctx, ff, FLY_COLORS, b.x, b.y, SCALE, b.h, bugHeadingAngle(b));
      }
    });

    powerUps.forEach(function(pu){
      // same ITEM_R glow circle for every power-up -- consistent size,
      // fill only, no stroke/border, regardless of type
      var glowColor = pu.type === "swatter" ? "#ffe066" : pu.type === "bubble" ? "#ff8fc7" : "#d9b98c";
      var glow = 0.55 + Math.sin(pu.y*0.15)*0.25;
      ctx.save();
      ctx.globalAlpha = glow;
      ctx.fillStyle = glowColor;
      ctx.beginPath();
      ctx.arc(pu.x, pu.y + pu.h*0.5, ITEM_R, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      if (pu.type === "swatter"){
        drawSprite(ctx, SWATTER_SPRITE, SWATTER_COLORS, pu.x, pu.y, SCALE);
      } else if (pu.type === "bubble"){
        drawSprite(ctx, PILL_SPRITE, PILL_COLORS, pu.x, pu.y, SCALE);
      } else {
        drawSprite(ctx, COFFEE_SPRITE, COFFEE_COLORS, pu.x, pu.y, SCALE);
      }
    });

    // iced-coffee speed lines -- a always-visible "zoom" tell that reads
    // the same way whether she's being dragged or driven with the keys,
    // since the raw movement-speed boost alone is easy to miss during a
    // slow, deliberate drag (she already tracks a slow finger 1:1 either way)
    if (coffeeTimer > 0 && girl.walking){
      var trailDir = girl.vx !== 0 ? (girl.vx > 0 ? -1 : 1) : -1;
      ctx.save();
      ctx.strokeStyle = "#ffd23f";
      ctx.lineCap = "round";
      for (var ti=0; ti<3; ti++){
        ctx.globalAlpha = 0.5 - ti*0.14;
        ctx.lineWidth = 3;
        var ly = girl.y + GIRL_H*0.3 + ti*9;
        var lx0 = girl.x + trailDir*(GIRL_W*0.5 + 3);
        var lx1 = lx0 + trailDir*(9 + ti*4);
        ctx.beginPath();
        ctx.moveTo(lx0, ly);
        ctx.lineTo(lx1, ly);
        ctx.stroke();
      }
      ctx.restore();
    }

    var swinging = swingFreezeTimer > 0;
    var swingP = swinging ? 1 - swingFreezeTimer/SWING_DURATION : 0;
    var swingSp = smoothstep(swingP);

    var girlFrame = girl.hasBubble
      ? (animFrame === 0 ? GIRL_DUCK_FRAME_A : GIRL_DUCK_FRAME_B)
      : (animFrame === 0 ? GIRL_FRAME_A : GIRL_FRAME_B);
    var girlColors = coffeeTimer > 0 ? GIRL_COLORS_COFFEE : GIRL_COLORS;

    if (swinging){
      var tilt = (swingSp - 0.5) * 0.35;
      ctx.save();
      ctx.translate(girl.x, girl.y + GIRL_H*0.5);
      ctx.rotate(tilt);
      ctx.translate(-girl.x, -(girl.y + GIRL_H*0.5));
      drawSprite(ctx, girlFrame, girlColors, girl.x, girl.y, SCALE);
      ctx.restore();
    } else {
      drawSprite(ctx, girlFrame, girlColors, girl.x, girl.y, SCALE);
    }

    if (swinging){
      // swatter sweeps along an arc from raised-back to a forward, downward
      // follow-through, with a little scale pulse right at the moment of impact
      var thetaStart = -100 * Math.PI/180, thetaEnd = 25 * Math.PI/180;
      var theta = thetaStart + (thetaEnd - thetaStart) * swingSp;
      var pivotX = girl.x, pivotY = girl.y + GIRL_H*0.15;
      var radius = GIRL_W*0.85;
      var swX = pivotX + Math.cos(theta)*radius;
      var swY = pivotY + Math.sin(theta)*radius;
      var impactPulse = zapTimer > 0 ? (zapTimer/0.28) : 0;
      var swatScale = SCALE*0.78 * (1 + impactPulse*0.35);
      drawSprite(ctx, SWATTER_SPRITE, SWATTER_COLORS, swX, swY, swatScale);
    } else if (girl.swatterCount > 0){
      var bob = Math.sin(performance.now()/200) * 2;
      var swX = girl.x + GIRL_W*0.62, swY = girl.y + 6 + bob;
      drawSprite(ctx, SWATTER_SPRITE, SWATTER_COLORS, swX, swY, SCALE*0.78);
      if (girl.swatterCount > 1){
        ctx.save();
        ctx.fillStyle = "#d43f80";
        ctx.beginPath();
        ctx.arc(swX + 14, swY - 4, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "9px 'Luckiest Guy', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("x" + girl.swatterCount, swX + 14, swY - 3);
        ctx.restore();
      }
    }

    if (girl.hasBubble){
      var bcx2 = girl.x, bcy2 = girl.y + GIRL_H*0.5;
      var shimmer = 1 + Math.sin(performance.now()/220)*0.03;
      var fade = bubbleTimer < 1.5 ? (0.4 + 0.6*Math.abs(Math.sin(performance.now()/90))) : 1;
      var drawBubbleRadius = BUBBLE_RADIUS*bubbleScale;
      ctx.save();
      ctx.globalAlpha = 0.22*fade;
      ctx.fillStyle = "#ff6fa8";
      ctx.beginPath();
      ctx.arc(bcx2, bcy2, drawBubbleRadius*shimmer, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 0.75*fade;
      ctx.strokeStyle = "#ff8fc7";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(bcx2, bcy2, drawBubbleRadius*shimmer, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 0.9*fade;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(bcx2 - drawBubbleRadius*0.35, bcy2 - drawBubbleRadius*0.5, drawBubbleRadius*0.18, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    if (pickupPulse > 0){
      var pa = pickupPulse / 0.5;
      ctx.save();
      ctx.globalAlpha = pa*0.6;
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(girl.x, girl.y+GIRL_H*0.5, (1-pa)*46 + 10, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    if (zapTimer > 0){
      var za = zapTimer / 0.28;
      var zcx2 = girl.x, zcy2 = girl.y + GIRL_H*ZAP_CENTER_Y_OFFSET;
      var zR2 = ZAP_RADIUS*zapScale;
      var zRx2 = zR2*ZAP_SIDE_MULT, zRy2 = zR2*ZAP_FORWARD_MULT;
      ctx.save();
      // racket-swing zone above her, flat edge at her hands -- reaches farther
      // ahead than it does to either side
      ctx.globalAlpha = za*0.5;
      ctx.fillStyle = "#fff6c9";
      ctx.beginPath();
      ctx.moveTo(zcx2 - zRx2, zcy2);
      ctx.ellipse(zcx2, zcy2, zRx2, zRy2, 0, Math.PI, 2*Math.PI);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = za;
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(zcx2, zcy2, zRx2, zRy2, 0, Math.PI, 2*Math.PI);
      ctx.stroke();
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 3;
      ctx.beginPath();
      var zx = girl.x, zy = girl.y;
      ctx.moveTo(zx, zy);
      for (var seg=1; seg<=5; seg++){
        zx += (Math.random()-0.5)*22;
        zy -= 30;
        ctx.lineTo(zx, zy);
      }
      ctx.stroke();
      ctx.restore();
    }

    // floating pink "+x" popup at the spot each bug died, drifting up and
    // fading out over SCORE_POPUP_DURATION
    scorePopups.forEach(function(p){
      var a = Math.max(0, Math.min(1, p.timer / SCORE_POPUP_DURATION));
      var riseY = p.y - (1 - a) * 26;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = "bold 15px 'Luckiest Guy', 'Baloo 2', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#3a2415";
      ctx.lineWidth = 3;
      ctx.strokeText("+" + p.points, p.x, riseY);
      ctx.fillStyle = "#ff6fa8";
      ctx.fillText("+" + p.points, p.x, riseY);
      ctx.restore();
    });

    ctx.restore();

    // nighttime blue filter over the whole game once she's racked up enough steps
    // -- multiply blend so it darkens and tints blue rather than just washing out
    if (nightMode){
      ctx.save();
      ctx.globalCompositeOperation = "multiply";
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = "#3349a3";
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = "#0b1230";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (shake > 0) shake = Math.max(0, shake - 0.05);
  }

  // ---------- loop ----------
  var lastTime = null;
  function frame(now){
    if (lastTime === null) lastTime = now;
    var dt = Math.min(0.05, (now - lastTime)/1000);
    lastTime = now;

    update(dt);
    render();
    refreshHud();

    requestAnimationFrame(frame);
  }

  // ---------- overlay control ----------
  function showOverlay(){
    overlay.hidden = false;
    overlay.classList.remove("fade-out");
  }
  function hideOverlay(){
    overlay.classList.add("fade-out");
    window.setTimeout(function(){ if(state===STATE_PLAYING) overlay.hidden = true; }, 160);
  }

  function startGame(){
    ensureAudio();
    resetGame();
    state = STATE_PLAYING;
    overlayTitleWrap.classList.remove("drop-in");
    flavorWatch.hidden = true;
    // the logo + high scores only ever show on the very first start screen --
    // once she's playing the game never returns to the ready state, so hide
    // them for good and let the in-canvas HUD + DIVA DOWN screen take over
    readyLogo.hidden = true;
    readyArt.hidden = true;
    readyScores.hidden = true;
    // the top/bottom split layout (title pinned up top, everything else
    // pinned to the bottom) only makes sense while there's art behind it --
    // drop back to the normal centered card for the PAUSED screen; gameOver()
    // turns it back on for the DIVA DOWN screen
    overlay.classList.remove("split-layout");
    // the HUD text only belongs on screen once she's actually walking -- it
    // stays hidden through the ready screen and pops in once play starts
    hudStats.hidden = false;
    hideOverlay();
    refreshHud();
    startMusic();
  }

  function resumeFromPause(){
    state = STATE_PLAYING;
    hideOverlay();
    startMusic();
  }

  function togglePause(){
    if (state === STATE_PLAYING){
      state = STATE_PAUSED;
      stopMusic();
      overlayTitleWrap.hidden = false;
      setOverlayTitle("PAUSED", false);
      overlayTitleWrap.classList.remove("drop-in");
      overlayText.hidden = false;
      overlayText.textContent = "Take a breath. The bugs will wait.";
      flavorWatch.hidden = true;
      deathWatch.hidden = true;
      viewScoresBtn.hidden = true;
      overlay.classList.remove("split-layout");
      startBtn.textContent = "Keep Groovin'";
      showOverlay();
    } else if (state === STATE_PAUSED){
      resumeFromPause();
    }
  }

  startBtn.addEventListener("click", function(){
    if (state === STATE_PAUSED){ resumeFromPause(); }
    else if (state === STATE_HIGHSCORES){ goBackToDeath(); }
    else startGame();
  });
  pauseBtn.addEventListener("click", function(){
    if (state === STATE_PLAYING || state === STATE_PAUSED) togglePause();
  });

  window.addEventListener("keydown", function(e){
    if (e.repeat) return;
    // typing a name (spaces, Enter) shouldn't also be read as game controls --
    // nameEntryInput has its own keydown handler for Enter
    if (document.activeElement === nameEntryInput) return;
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keyLeft = true;
    if (k === "ArrowRight" || k === "d" || k === "D") keyRight = true;
    if (k === " " || k === "Enter" || k === "ArrowUp"){
      e.preventDefault();
      if (state === STATE_READY || state === STATE_OVER) startGame();
      else if (state === STATE_PAUSED){ resumeFromPause(); }
    }
    if (k === "p" || k === "P" || k === "Escape"){
      if (state === STATE_PLAYING || state === STATE_PAUSED) togglePause();
    }
  });
  window.addEventListener("keyup", function(e){
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keyLeft = false;
    if (k === "ArrowRight" || k === "d" || k === "D") keyRight = false;
  });

  function localX(clientX){
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    return (clientX - rect.left) * scaleX;
  }

  canvas.addEventListener("pointerdown", function(e){
    if (state === STATE_READY || state === STATE_OVER){ startGame(); return; }
    if (state !== STATE_PLAYING) return;
    dragging = true;
    screenWrap.classList.add("dragging");
    pointerTargetX = Math.max(GIRL_MIN_X, Math.min(GIRL_MAX_X, localX(e.clientX)));
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function(e){
    if (!dragging) return;
    pointerTargetX = Math.max(GIRL_MIN_X, Math.min(GIRL_MAX_X, localX(e.clientX)));
  });
  function endDrag(){
    dragging = false;
    pointerTargetX = null;
    screenWrap.classList.remove("dragging");
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", function(){ if(dragging) endDrag(); });

  document.addEventListener("visibilitychange", function(){
    if (document.hidden && state === STATE_PLAYING) togglePause();
  });

  // ---------- boot ----------
  function boot(initData){
    if (initData && typeof initData.highScore === "number"){
      highScore = Math.max(highScore, initData.highScore);
    }
    if (initData && typeof initData.highSteps === "number"){
      highSteps = Math.max(highSteps, initData.highSteps);
    }
    if (initData && typeof initData.bestSwatterKills === "number"){
      bestSwatterKills = Math.max(bestSwatterKills, initData.bestSwatterKills);
    }
    if (initData && typeof initData.bestRoachKills === "number"){
      bestRoachKills = Math.max(bestRoachKills, initData.bestRoachKills);
    }
    if (initData && typeof initData.bestNightKills === "number"){
      bestNightKills = Math.max(bestNightKills, initData.bestNightKills);
    }
    // warm the leaderboard cache in the background so it's ready by the time
    // anyone finishes a run or taps "High Scores" -- failures here are silent
    // (renderHighscoresList handles every status) so this never blocks boot
    fetchLeaderboard(function(){});

    // no "READY?" text anymore -- the start button sits in that spot instead
    // (see #startBtn's new position in the HTML)
    overlayTitleWrap.hidden = true;
    drawLogoText();
    // the pixel-text canvases are baked once from whatever font is active at
    // draw time -- if the Press Start 2P webfont is still loading, redraw
    // once it's actually available so the very first paint doesn't get stuck
    // with a fallback-font bitmap
    if (document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        if (state === STATE_READY) overlayTitleWrap.hidden = true;
        drawLogoText();
        // force the death/ready watches to re-rasterize with the real
        // Silkscreen font once it's actually loaded, instead of staying
        // stuck with whatever fallback-font bitmap they drew on the very
        // first paint -- recompute the value box size and redraw the
        // static labels too, from the real font's metrics, so nothing
        // locks in a fallback-font measurement. The in-game HUD is plain
        // text now, so it just re-renders in the new font on its own.
        watchValueBoxSize = measureWatchValueBox();
        drawDeathWatchLabels();
        drawReadyWatch(highSteps, highScore);
        lastWatchSteps = null;
        lastWatchMood = null;
        refreshHud();
        // if she's already down when the real font finishes loading, redraw
        // the frozen death-watch numbers too so they don't stay stuck in
        // the fallback-font bitmap
        if (state === STATE_OVER){
          refreshDeathWatch(steps, score, Math.max(highSteps, steps), Math.max(highScore, score));
        }
      });
    }
    resizeGame();
    buildScenery();
    render();
    refreshHud();
    requestAnimationFrame(frame);

    window.addEventListener("resize", resizeGame);
    window.addEventListener("orientationchange", resizeGame);
    if (typeof ResizeObserver !== "undefined"){
      new ResizeObserver(resizeGame).observe(screenWrap);
    }
  }

  if (window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){
      return {
        highScore: highScore, highSteps: highSteps,
        bestSwatterKills: bestSwatterKills, bestRoachKills: bestRoachKills, bestNightKills: bestNightKills
      };
    });
    if (window.claude.hot.ready) window.claude.hot.ready(boot);
    else boot(window.claude.hot.data || {});
  } else {
    boot({});
  }
})();
</script>
